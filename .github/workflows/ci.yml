name: Validate and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm run check
      - name: Save FIELDNOTE v2 preview
        if: github.ref == 'refs/heads/work/fieldnote-v2'
        uses: actions/upload-artifact@v4
        with:
          name: fieldnote-v2-preview-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
