name: Validate and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm run check
      - name: Save validated FIELDNOTE build
        uses: actions/upload-artifact@v4
        with:
          name: fieldnote-build-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
