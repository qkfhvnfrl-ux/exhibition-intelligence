name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the stable site
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate the stable site
        run: |
          npm run build
          npm run check
      - name: Assemble the official release and compatible preview address
        run: node scripts/assemble-pages-release.mjs dist publish "$GITHUB_SHA" "$GITHUB_RUN_ID"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the verified release
        uses: actions/upload-pages-artifact@v4
        with:
          path: publish
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the verified site
        id: deployment
        uses: actions/deploy-pages@v4
